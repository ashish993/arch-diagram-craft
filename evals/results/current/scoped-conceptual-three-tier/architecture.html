<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Conceptual AWS Online Store — Three-Tier Architecture</title>
<style>
:root{color-scheme:light;--ink:#172b4d;--muted:#526581;--line:#9aabc2;--bg:#f4f7fb;--blue:#eaf3ff;--orange:#fff2df;--green:#e9f7ef;--purple:#f4edff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font:16px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}header{max-width:1440px;margin:auto;padding:24px 30px 10px}h1{font-size:clamp(1.45rem,2.5vw,2.1rem);margin:0 0 4px}header p{margin:0;color:var(--muted)}.canvas{max-width:1440px;margin:auto;padding:12px 24px 26px;overflow-x:auto}svg{display:block;width:100%;min-width:880px;height:auto;background:white;border:1px solid #dbe3ee;border-radius:16px;box-shadow:0 8px 24px #23395b12}text{font-family:inherit;fill:var(--ink)}.tier{stroke:#bdc9da;stroke-width:1.5;rx:16}.tier-title{font-size:19px;font-weight:700}.tier-sub{font-size:13px;fill:var(--muted)}.node{stroke-width:1.5;rx:12}.node-title{font-size:16px;font-weight:700}.node-sub{font-size:13px;fill:var(--muted)}.tag{font-size:11px;font-weight:700;letter-spacing:.04em;fill:#704800}.flow{fill:none;stroke:#355b91;stroke-width:2.5;marker-end:url(#arrow)}.response{fill:none;stroke:#9b5a16;stroke-width:2.5;stroke-dasharray:8 6;marker-end:url(#arrowResp)}.flowlabel{font-size:13px;font-weight:650;paint-order:stroke;stroke:white;stroke-width:6;stroke-linejoin:round}.legend{font-size:12px;fill:var(--muted)}.assumption{font-size:12px;font-weight:700;fill:#704800}.scope{font-size:13px;fill:var(--muted)}
@media(max-width:700px){header{padding:18px 16px 6px}.canvas{padding:8px 10px 18px}}
</style>
</head>
<body>
<header><h1>Conceptual AWS Online Store</h1><p>Three-tier logical architecture · proposed concept · service selections and placement are assumptions</p></header>
<main class="canvas" role="region" aria-label="Scrollable architecture diagram"><svg viewBox="0 0 1280 760" role="img" aria-labelledby="svgtitle svgdesc">
<title id="svgtitle">Conceptual AWS online store three-tier architecture</title><desc id="svgdesc">Customers send HTTPS requests through Route 53 and CloudFront to an Application Load Balancer, then to web and application tiers, and finally Amazon RDS. Dashed amber arrows show responses returning along the same logical path. AWS service choices and placements are assumptions.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#355b91"/></marker><marker id="arrowResp" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9b5a16"/></marker></defs>
<text x="42" y="42" class="scope">Scope: conceptual request/response path for an online store; no environment, account, region, security, or availability design asserted.</text>
<!-- customers -->
<rect x="42" y="302" width="150" height="116" class="node" fill="#f4edff" stroke="#b7a0dc"/><text x="117" y="340" text-anchor="middle" class="node-title">Customers</text><text x="117" y="365" text-anchor="middle" class="node-sub">Browser / mobile client</text><text x="117" y="390" text-anchor="middle" class="assumption">Actor from prompt</text>
<!-- entry -->
<rect x="235" y="90" width="240" height="570" class="tier" fill="#f8fbff"/><text x="260" y="126" class="tier-title">Public entry</text><text x="260" y="149" class="tier-sub">Internet-facing request path · assumed</text>
<rect x="270" y="205" width="170" height="86" class="node" fill="#eaf3ff" stroke="#83aee0"/><text x="355" y="239" text-anchor="middle" class="node-title">Amazon Route 53</text><text x="355" y="263" text-anchor="middle" class="node-sub">DNS · assumption</text>
<rect x="270" y="350" width="170" height="86" class="node" fill="#eaf3ff" stroke="#83aee0"/><text x="355" y="384" text-anchor="middle" class="node-title">Amazon CloudFront</text><text x="355" y="408" text-anchor="middle" class="node-sub">CDN / edge · assumption</text>
<rect x="270" y="495" width="170" height="86" class="node" fill="#eaf3ff" stroke="#83aee0"/><text x="355" y="529" text-anchor="middle" class="node-title">Application Load Balancer</text><text x="355" y="553" text-anchor="middle" class="node-sub">ALB · assumption</text>
<!-- tiers -->
<rect x="510" y="90" width="220" height="570" class="tier" fill="#f8fbff"/><text x="535" y="126" class="tier-title">Web tier</text><text x="535" y="149" class="tier-sub">Presentation · placement assumed</text>
<rect x="540" y="330" width="160" height="116" class="node" fill="#eaf3ff" stroke="#83aee0"/><text x="620" y="367" text-anchor="middle" class="node-title">Web frontend</text><text x="620" y="392" text-anchor="middle" class="node-sub">Amazon ECS on Fargate</text><text x="620" y="418" text-anchor="middle" class="assumption">Service / placement assumption</text>
<rect x="765" y="90" width="220" height="570" class="tier" fill="#fffbf4"/><text x="790" y="126" class="tier-title">Application tier</text><text x="790" y="149" class="tier-sub">Business logic · placement assumed</text>
<rect x="795" y="330" width="160" height="116" class="node" fill="#fff2df" stroke="#e6b66a"/><text x="875" y="367" text-anchor="middle" class="node-title">Store API</text><text x="875" y="392" text-anchor="middle" class="node-sub">Amazon ECS on Fargate</text><text x="875" y="418" text-anchor="middle" class="assumption">Service / placement assumption</text>
<rect x="1020" y="90" width="220" height="570" class="tier" fill="#f7fcf8"/><text x="1045" y="126" class="tier-title">Database tier</text><text x="1045" y="149" class="tier-sub">Persistence · placement assumed</text>
<rect x="1050" y="330" width="160" height="116" class="node" fill="#e9f7ef" stroke="#8ac6a0"/><text x="1130" y="367" text-anchor="middle" class="node-title">Amazon RDS</text><text x="1130" y="392" text-anchor="middle" class="node-sub">Relational store</text><text x="1130" y="418" text-anchor="middle" class="assumption">Engine / placement assumption</text>
<!-- forward request arrows -->
<path d="M192 325 C215 325 218 248 270 248" class="flow"/><text x="204" y="278" class="flowlabel">1 · DNS lookup</text>
<path d="M192 357 C220 357 230 393 270 393" class="flow"/><text x="204" y="383" class="flowlabel">3 · HTTPS request</text>
<path d="M270 265 C220 278 216 318 192 325" class="response"/><text x="197" y="305" class="flowlabel">2 · DNS answer</text>
<path d="M355 436 L355 495" class="flow"/><text x="369" y="472" class="flowlabel">4 · origin request</text>
<path d="M440 538 C486 538 490 388 540 388" class="flow"/><text x="453" y="506" class="flowlabel">5 · forward request</text>
<path d="M700 388 L795 388" class="flow"/><text x="712" y="369" class="flowlabel">6 · page / API request</text>
<path d="M955 388 L1050 388" class="flow"/><text x="964" y="369" class="flowlabel">7 · query / update</text>
<!-- response path -->
<path d="M1050 428 L955 428" class="response"/><text x="967" y="457" class="flowlabel">8 · query result</text>
<path d="M795 428 L700 428" class="response"/><text x="713" y="457" class="flowlabel">9 · API response</text>
<path d="M540 428 C490 428 486 578 440 578" class="response"/><text x="460" y="601" class="flowlabel">10 · rendered response</text>
<path d="M355 581 L355 436" class="response"/><text x="369" y="615" class="flowlabel">11 · response to edge</text>
<path d="M270 393 C230 393 220 394 192 394" class="response"/><text x="199" y="425" class="flowlabel">12 · HTTPS response</text>
<!-- legend -->
<line x1="58" y1="704" x2="112" y2="704" class="flow"/><text x="124" y="709" class="legend">Request direction</text><line x1="290" y1="704" x2="344" y2="704" class="response"/><text x="356" y="709" class="legend">Response direction</text><text x="555" y="709" class="legend">All protocol details beyond HTTPS at customer edge are unspecified; internal labels describe logical interactions only.</text>
<text x="58" y="739" class="assumption">ASSUMPTIONS: Route 53, CloudFront, ALB, ECS/Fargate, and RDS are illustrative choices. Region, VPC/subnets, public/private placement, scaling, security controls, and RDS engine are not specified.</text>
</svg></main></body></html>
