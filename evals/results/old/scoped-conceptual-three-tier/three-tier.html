<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Conceptual AWS three-tier online store</title>
<style>body{margin:0;background:#f3f6fa;color:#172b4d;font:16px/1.45 system-ui,sans-serif}main{max-width:1200px;margin:auto;padding:28px}h1{margin:0;font-size:28px}p{margin:6px 0 20px;color:#52657e}.canvas{overflow-x:auto;border:1px solid #d7e0eb;border-radius:14px;background:#fff}svg{display:block;width:1100px;max-width:none;height:auto}text{font-family:system-ui,sans-serif} .tier{fill:#f5f9ff;stroke:#8ca7c5;stroke-width:2}.node{fill:#fff;stroke:#56799f;stroke-width:2}.assume{fill:#fff9e8;stroke:#d8a232;stroke-width:2}.edge{stroke:#176b87;stroke-width:3;fill:none;marker-end:url(#arrow)}.return{stroke:#a25847;stroke-width:3;fill:none;marker-end:url(#arrow2)}.label{font-size:15px;fill:#172b4d}.small{font-size:13px;fill:#53677f}.title{font-size:21px;font-weight:700;fill:#183b5b}.tiertitle{font-size:19px;font-weight:700;fill:#234c72}.tag{font-size:12px;font-weight:700;fill:#815b08}</style></head>
<body><main><h1>Conceptual AWS three-tier online store</h1><p>Illustrative logical view · all AWS services and placements below are assumptions, not a validated design.</p><div class="canvas" role="region" aria-label="Scrollable architecture diagram" tabindex="0"><svg viewBox="0 0 1100 700" role="img" aria-labelledby="svgtitle svgdesc"><title id="svgtitle">Conceptual AWS three-tier online store</title><desc id="svgdesc">Customer requests pass through Route 53 and CloudFront to an Application Load Balancer, then an EC2 web tier, an application tier, and an RDS database. Responses return along the reverse path. All choices and placement are assumptions.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#176b87"/></marker><marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#a25847"/></marker></defs>
<text x="35" y="42" class="title">Request path ↓ · response path ↑</text>
<!-- actor --> <rect x="40" y="285" width="145" height="84" rx="12" class="node"/><text x="112" y="320" text-anchor="middle" class="tiertitle">Customers</text><text x="112" y="345" text-anchor="middle" class="small">Browser / app</text>
<!-- public entry --> <rect x="230" y="125" width="235" height="410" rx="16" class="tier"/><text x="250" y="158" class="tiertitle">Public entry</text><rect x="265" y="195" width="165" height="68" rx="10" class="assume"/><text x="347" y="224" text-anchor="middle" class="label">Amazon Route 53</text><text x="347" y="246" text-anchor="middle" class="tag">ASSUMPTION</text><rect x="265" y="315" width="165" height="78" rx="10" class="assume"/><text x="347" y="345" text-anchor="middle" class="label">Amazon CloudFront</text><text x="347" y="370" text-anchor="middle" class="tag">ASSUMPTION</text><rect x="265" y="440" width="165" height="68" rx="10" class="assume"/><text x="347" y="468" text-anchor="middle" class="label">Application Load Balancer</text><text x="347" y="490" text-anchor="middle" class="tag">ASSUMPTION</text>
<!-- web --> <rect x="505" y="125" width="190" height="410" rx="16" class="tier"/><text x="525" y="158" class="tiertitle">Web tier</text><rect x="530" y="275" width="140" height="100" rx="10" class="assume"/><text x="600" y="308" text-anchor="middle" class="label">Amazon EC2</text><text x="600" y="332" text-anchor="middle" class="small">Web server</text><text x="600" y="355" text-anchor="middle" class="tag">ASSUMPTION</text>
<!-- app --> <rect x="735" y="125" width="175" height="410" rx="16" class="tier"/><text x="755" y="158" class="tiertitle">Application tier</text><rect x="757" y="275" width="132" height="100" rx="10" class="assume"/><text x="823" y="308" text-anchor="middle" class="label">Amazon EC2</text><text x="823" y="332" text-anchor="middle" class="small">Store API / logic</text><text x="823" y="355" text-anchor="middle" class="tag">ASSUMPTION</text>
<!-- db --> <rect x="950" y="125" width="130" height="410" rx="16" class="tier"/><text x="970" y="158" class="tiertitle">Database</text><rect x="970" y="275" width="90" height="100" rx="10" class="assume"/><text x="1015" y="308" text-anchor="middle" class="label">Amazon</text><text x="1015" y="331" text-anchor="middle" class="label">RDS</text><text x="1015" y="355" text-anchor="middle" class="tag">ASSUMPTION</text>
<!-- forward flows --> <path d="M185 300 H247 V229 H265" class="edge"/><text x="193" y="282" class="small">1. HTTPS request</text><path d="M347 263 V314" class="edge"/><text x="355" y="294" class="small">2. Resolve / cache</text><path d="M347 393 V438" class="edge"/><text x="355" y="423" class="small">3. Origin request</text><path d="M430 474 H480 V325 H530" class="edge"/><text x="437" y="462" class="small">4. HTTP request</text><path d="M670 325 H757" class="edge"/><text x="678" y="309" class="small">5. API call</text><path d="M889 325 H970" class="edge"/><text x="897" y="309" class="small">6. Query / update</text>
<!-- reverse flows --> <path d="M970 355 H889" class="return"/><text x="900" y="387" class="small">7. Result</text><path d="M757 355 H670" class="return"/><text x="680" y="387" class="small">8. API response</text><path d="M530 355 H480 V494 H430" class="return"/><text x="438" y="522" class="small">9. Web response</text><path d="M265 475 H245 V354 H185" class="return"/><text x="191" y="375" class="small">10. Response</text>
<rect x="230" y="575" width="850" height="80" rx="12" fill="#fff9e8" stroke="#d8a232" stroke-width="2"/><text x="252" y="607" class="label" font-weight="700">Assumption key</text><text x="252" y="633" class="small">Every named AWS service and its tier placement is illustrative. No account, region, network design, scaling, security, or availability details were supplied.</text><text x="40" y="650" class="small">Conceptual only · not deployment guidance</text></svg></div></main></body></html>
