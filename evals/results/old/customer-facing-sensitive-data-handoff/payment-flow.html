<body><main><h1>Fictional payment service: data flow</h1><p>Customer-facing conceptual view based on the supplied synthetic brief. Controls not stated in the brief are shown as gaps.</p>
<svg role="img" aria-labelledby="title desc" viewBox="0 0 1080 650" xmlns="http://www.w3.org/2000/svg"><title id="title">Fictional payment service data flow</title><desc id="desc">Customer submits cart and payment token to Store API over HTTPS. Store API calls external provider, records transaction metadata, publishes order ID event, and serves Operations Console status and provider reference. Trust zones and unknown controls are noted.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#31536e"/></marker></defs>
<rect class="zone" x="25" y="50" width="205" height="485" rx="14"/><text class="label" x="42" y="80">Customer zone</text>
<rect class="zone" x="270" y="50" width="555" height="485" rx="14"/><text class="label" x="288" y="80">Store application account</text>
<rect class="zone" x="865" y="50" width="190" height="220" rx="14"/><text class="label" x="882" y="80">External provider zone</text>
<rect class="node" x="65" y="180" width="125" height="80" rx="10"/><text class="label" x="88" y="215">Customer</text><text class="small" x="81" y="239">cart + payment token</text>
<rect class="node" x="340" y="160" width="180" height="100" rx="10"/><text class="label" x="394" y="195">Store API</text><text class="small" x="366" y="221">order processing</text>
<rect class="external" x="895" y="145" width="130" height="90" rx="10"/><text class="label" x="920" y="180">Payment</text><text class="label" x="917" y="202">Provider</text>
<rect class="store" x="600" y="340" width="190" height="85" rx="10"/><text class="label" x="628" y="375">Order Database</text><text class="small" x="615" y="400">order + payment metadata</text>
<rect class="node" x="330" y="385" width="190" height="75" rx="10"/><text class="label" x="354" y="416">Order Events topic</text><text class="small" x="370" y="440">OrderPlaced</text>
<rect class="node" x="580" y="145" width="210" height="90" rx="10"/><text class="label" x="607" y="180">Operations Console</text><text class="small" x="607" y="205">status + provider reference</text>
<path class="flow" d="M190 205H335"/><text class="small" x="222" y="192">cart + payment token</text><text class="small" x="235" y="224">HTTPS</text>
<path class="flow" d="M520 185H890"/><text class="small" x="635" y="168">payment token + amount / HTTPS</text>
<path class="flow" d="M890 215H525"/><text class="small" x="655" y="237">authorization result + provider reference</text>
<path class="flow" d="M450 265V380"/><text class="small" x="463" y="310">order ID only</text><path class="flow" d="M510 245L630 335"/><text class="small" x="520" y="293">order ID, customer ID, amount,</text><text class="small" x="520" y="312">authorization result, provider reference</text>
<path class="flow" d="M680 240V335"/><text class="small" x="690" y="280">reads status + provider reference</text>
<rect class="gap" x="292" y="485" width="518" height="38" rx="8"/><text class="small" x="310" y="510">Unspecified: other encryption, identity/access, network placement, secrets</text>
<rect class="gap" x="845" y="325" width="205" height="150" rx="10"/><text class="label" x="865" y="355">Open operational gaps</text><text class="small" x="865" y="382">Console roles, auth, audit</text><text class="small" x="865" y="405">Retention, backups, region</text><text class="small" x="865" y="428">Availability, RTO/RPO, alerts</text><text class="small" x="865" y="451">Support ownership</text>
</svg><p><strong>Status:</strong> source-grounded draft for review; not a production validation or security/compliance assessment.</p></main></body></html>
